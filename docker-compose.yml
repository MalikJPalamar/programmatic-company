services:
  uapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uapp-router
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - NODE_ENV=production
      - UAPP_API_KEY=${UAPP_API_KEY}
      - GHL_API_KEY=${GHL_API_KEY}
      - GHL_LOCATION_ID=${GHL_LOCATION_ID}
      - ONTRAPORT_API_KEY=${ONTRAPORT_API_KEY}
      - ONTRAPORT_APP_ID=${ONTRAPORT_APP_ID}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - MIGHTY_API_KEY=${MIGHTY_API_KEY}
      - MIGHTY_COMMUNITY_ID=${MIGHTY_COMMUNITY_ID}
      - RETREATGURU_API_KEY=${RETREATGURU_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uapp.rule=Host(`uapp.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.uapp.entrypoints=websecure"
      - "traefik.http.routers.uapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.uapp.loadbalancer.server.port=3100"
    volumes:
      - uapp-data:/app/.mission-control
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  uapp-data:
